name: Test Astro Build (pnpm)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install dependencies (verbose)
        run: pnpm install --frozen-lockfile --reporter=ndjson

      - name: Build Astro (verbose)
        run: pnpm build --reporter=ndjson
